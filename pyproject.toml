[build-system]
requires = ["setuptools>=61", "pybind11>=2.12", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-engine"
version = "0.2.0"
description = "High-performance Xiangqi engine and AlphaZero policy-value network"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "torch", "numpy"]
train = ["torch", "numpy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
