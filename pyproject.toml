[build-system]
requires = ["setuptools>=61", "pybind11>=2.12", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-engine"
version = "0.3.0"
description = "High-performance Xiangqi engine and AlphaZero policy-value network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "pytest>=8.0",
]

[project.scripts]
xiangqi-train = "xiangqi_engine.loop:main"
xiangqi-play = "xiangqi_engine.play.server:main"

[tool.setuptools.package-data]
xiangqi_engine = ["play/static/*"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
